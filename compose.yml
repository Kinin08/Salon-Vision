services:
  web:
    build: .
    container_name: salonvision-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: salonvision-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Salon_Vision
      MYSQL_USER: salon
      MYSQL_PASSWORD: 12345678
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data-base:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: salonvision-pma
    restart: always
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"

volumes:
  mysql-data: