<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salon Vision | Painel do Cliente</title>


    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@300;400;500;600;700&family=Yuji+Syuku&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <script type="module" src="./script/main.js" defer></script>
</head>

<body class="bg-black font-['Poppins']">

    <!-- Aurora de fundo -->
    <div class="aurora-wrap">
        <div class="aurora-1"></div>
        <div class="aurora-2"></div>
    </div>

    <!-- Layout principal -->
    <div class="layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="sidebar-logo">
                <svg class="w-8 h-8 text-[#FFCC7F]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <path d="M12 2L3 7l9 5 9-5-9-5zM3 17l9 5 9-5M3 12l9 5 9-5" />
                </svg>
                <div>
                    <div class="font-yuji text-xl text-white [text-shadow:0_0_10px_rgba(255,204,127,0.8)]">
                        <span class="text-[#CA9440]">S</span><span>alon</span>
                        <span class="text-[#CA9440]">V</span><span>ision</span>
                    </div>
                    <span class="logo-badge-admin">CLIENTE</span>
                </div>
            </div>

            <!-- Nav -->
            <nav class="nav-section">
                <h2 class="nav-label">Menu</h2>

                <a id="nav-inicio" class="nav-item active cursor-pointer" href="#">
                    <i class="ti ti-home"></i>
                    <h1>Dashboard</h1>
                </a>
                <a id="nav-agendamentos" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-calendar"></i>
                    <h1>Agendar</h1>
                </a>
                <a id="nav-faqs" class="nav-item">
                    <i class="ti ti-home-question"></i> Perguntas Frequentes
                </a>
                <h2 class="nav-label" style="margin-top:10px;">Descobrir</h2>

                <a id="nav-servicos" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-cut"></i>
                    <h1>Serviços</h1>
                </a>
                <a id="nav-profissionais" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-user-star"></i>
                    <h1>Profissionais</h1>
                </a>

                <h2 class="nav-label" style="margin-top:10px;">Conta</h2>

                <a id="nav-perfil" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-user-circle"></i>
                    <h1>Meu Perfil</h1>
                </a>
            </nav>

        </aside>

        <!-- ===== MAIN ===== -->
        <div class="main">

            <!-- TOPBAR -->
            <header class="topbar">
                <div>
                    <h1 class="topbar-title" id="topbar-title">Meu <em>Dashboard</em></h1>
                    <h2 class="tb-date" id="topbar-date"></h2>
                </div>
            </header>

            <!-- CONTENT (trocado dinamicamente) -->
            <main class="content" id="page-content">
                <!-- Início é carregado via JS -->
            </main>

        </div>
    </div><!-- /layout -->

    <!-- ===== MODAL: NOVO AGENDAMENTO ===== -->
    <div class="modal-overlay" id="modalAgendar">
        <div class="modal-box">
            <h2 class="modal-title">Novo <em>Agendamento</em></h2>

            <div class="form-group">
                <label class="form-label">Serviço</label>
                <select class="form-input" id="modalServico">
                    <option>Coloração</option>
                    <option>Corte Feminino</option>
                    <option>Escova & Tratamento</option>
                    <option>Manicure</option>
                    <option>Hidratação Profunda</option>
                    <option>Sobrancelha</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Profissional</label>
                <select class="form-input" id="modalProf">
                    <option>Camila R.</option>
                    <option>Priya A.</option>
                    <option>Lucas T.</option>
                    <option>Aline F.</option>
                    <option>Renata M.</option>
                </select>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" class="form-input" id="modalData" />
                </div>
                <div class="form-group">
                    <label class="form-label">Horário</label>
                    <select class="form-input" id="modalHora">
                        <option>09:00</option>
                        <option>09:30</option>
                        <option>10:00</option>
                        <option>10:30</option>
                        <option>11:00</option>
                        <option>11:30</option>
                        <option>14:00</option>
                        <option>14:30</option>
                        <option>15:00</option>
                        <option>15:30</option>
                        <option>16:00</option>
                        <option>16:30</option>
                    </select>
                </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px;">
                <button class="btn btn-gold" style="flex:1" id="modalConfirmar">
                    <i class="ti ti-check"></i> Confirmar
                </button>
                <button class="btn btn-ghost" id="modalCancelar">
                    <i class="ti ti-x"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"><i class="ti ti-check"></i> <span id="toast-msg">Ação realizada!</span></div>
</body>

</html>
