<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salon Vision | Painel do Cliente</title>


    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@300;400;500;600;700&family=Yuji+Syuku&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
</head>

<body class="bg-black font-['Poppins']">

    <!-- Aurora de fundo -->
    <div class="aurora-wrap">
        <div class="aurora-1"></div>
        <div class="aurora-2"></div>
    </div>

    <!-- Layout principal -->
    <div class="layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="sidebar-logo">
                <svg class="w-8 h-8 text-[#FFCC7F]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <path d="M12 2L3 7l9 5 9-5-9-5zM3 17l9 5 9-5M3 12l9 5 9-5" />
                </svg>
                <div>
                    <div class="font-yuji text-xl text-white [text-shadow:0_0_10px_rgba(255,204,127,0.8)]">
                        <span class="text-[#CA9440]">S</span><span>alon</span>
                        <span class="text-[#CA9440]">V</span><span>ision</span>
                    </div>
                    <span class="logo-badge-admin">CLIENTE</span>
                </div>
            </div>

            <!-- Nav -->
            <nav class="nav-section">
                <h2 class="nav-label">Menu</h2>

                <a id="nav-inicio" class="nav-item active cursor-pointer" href="#">
                    <i class="ti ti-home"></i>
                    <h1>Início</h1>
                </a>
                <a id="nav-agendamentos" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-calendar"></i>
                    <h1>Agendar</h1>
                </a>
                <a id="nav-historico" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-history"></i>
                    <h1>Histórico</h1>
                </a>

                <h2 class="nav-label" style="margin-top:10px;">Descobrir</h2>

                <a id="nav-servicos" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-cut"></i>
                    <h1>Serviços</h1>
                </a>
                <a id="nav-profissionais" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-user-star"></i>
                    <h1>Profissionais</h1>
                </a>

                <h2 class="nav-label" style="margin-top:10px;">Conta</h2>

                <a id="nav-perfil" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-user-circle"></i>
                    <h1>Meu Perfil</h1>
                </a>
            </nav>

            <!-- User card -->
            <div class="sidebar-bottom">
                <div class="user-card">
                    <img src="https://i.pravatar.cc/80?img=47" class="user-avatar" alt="Ana Costa" />
                    <div class="user-info">
                        <p>Ana Costa</p>
                        <span>Cliente</span>
                    </div>
                    <i class="ti ti-dots-vertical" style="margin-left:auto;color:var(--text-dim);font-size:14px;"></i>
                </div>
            </div>
        </aside>

        <!-- ===== MAIN ===== -->
        <div class="main">

            <!-- TOPBAR -->
            <header class="topbar">
                <div>
                    <h1 class="topbar-title" id="topbar-title">Olá, <em>Ana!</em></h1>
                    <h2 class="tb-date" id="topbar-date"></h2>
                </div>
                <div class="topbar-right">
                    <img src="https://i.pravatar.cc/80?img=47"
                        style="width:34px;height:34px;border-radius:9px;object-fit:cover;border:1px solid var(--border-strong);"
                        alt="Ana Costa" />
                </div>
            </header>

            <!-- CONTENT (trocado dinamicamente) -->
            <main class="content" id="page-content">
                <!-- Início é carregado via JS -->
            </main>

        </div>
    </div><!-- /layout -->

    <!-- ===== MODAL: NOVO AGENDAMENTO ===== -->
    <div class="modal-overlay" id="modalAgendar">
        <div class="modal-box">
            <h2 class="modal-title">Novo <em>Agendamento</em></h2>

            <div class="form-group">
                <label class="form-label">Serviço</label>
                <select class="form-input" id="modalServico">
                    <option>Coloração</option>
                    <option>Corte Feminino</option>
                    <option>Escova & Tratamento</option>
                    <option>Manicure</option>
                    <option>Hidratação Profunda</option>
                    <option>Sobrancelha</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Profissional</label>
                <select class="form-input" id="modalProf">
                    <option>Camila R.</option>
                    <option>Priya A.</option>
                    <option>Lucas T.</option>
                    <option>Aline F.</option>
                    <option>Renata M.</option>
                </select>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" class="form-input" id="modalData" />
                </div>
                <div class="form-group">
                    <label class="form-label">Horário</label>
                    <select class="form-input" id="modalHora">
                        <option>09:00</option>
                        <option>09:30</option>
                        <option>10:00</option>
                        <option>10:30</option>
                        <option>11:00</option>
                        <option>11:30</option>
                        <option>14:00</option>
                        <option>14:30</option>
                        <option>15:00</option>
                        <option>15:30</option>
                        <option>16:00</option>
                        <option>16:30</option>
                    </select>
                </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:8px;">
                <button class="btn btn-gold" style="flex:1" id="modalConfirmar">
                    <i class="ti ti-check"></i> Confirmar
                </button>
                <button class="btn btn-ghost" id="modalCancelar">
                    <i class="ti ti-x"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"><i class="ti ti-check"></i> <span id="toast-msg">Ação realizada!</span></div>


    <script>
        /* ================================================================
           SALON VISION — PAINEL DO CLIENTE
           SPA com troca dinâmica de conteúdo por seção
        ================================================================ */

        /* ---- Dados do cliente logado ---- */
        const CLIENTE = {
            nome: 'Ana Costa',
            email: 'ana.costa@email.com',
            telefone: '(51) 99234-5678',
            foto: 'https://i.pravatar.cc/80?img=47',
            totalAgendamentos: 34,
            avaliacoesFeitas: 28,
            favoritos: ['Coloração', 'Escova & Tratamento', 'Sobrancelha'],
        };

        const STATUS_LABEL = {
            confirmed: 'Confirmado',
            pending: 'Pendente',
            done: 'Concluído',
            cancelled: 'Cancelado',
        };

        /* ---- Agendamentos do cliente ---- */
        let meusAgendamentos = [
            { id: 1, servico: 'Coloração', profissional: 'Camila R.', data: '20/06/2025', hora: '10:00', status: 'confirmed' },
            { id: 2, servico: 'Sobrancelha', profissional: 'Renata M.', data: '22/06/2025', hora: '14:30', status: 'pending' },
            { id: 3, servico: 'Escova & Tratamento', profissional: 'Priya A.', data: '25/06/2025', hora: '09:30', status: 'confirmed' },
            { id: 4, servico: 'Manicure', profissional: 'Aline F.', data: '28/06/2025', hora: '16:00', status: 'pending' },
        ];

        /* ---- Histórico ---- */
        const historico = [
            { servico: 'Coloração', profissional: 'Camila R.', data: '05/06/2025', valor: 'R$ 280', avaliacao: 5 },
            { servico: 'Escova & Tratamento', profissional: 'Priya A.', data: '28/05/2025', valor: 'R$ 120', avaliacao: 5 },
            { servico: 'Manicure', profissional: 'Aline F.', data: '20/05/2025', valor: 'R$ 60', avaliacao: 4 },
            { servico: 'Sobrancelha', profissional: 'Renata M.', data: '12/05/2025', valor: 'R$ 45', avaliacao: 5 },
            { servico: 'Hidratação Profunda', profissional: 'Priya A.', data: '02/05/2025', valor: 'R$ 95', avaliacao: 4 },
            { servico: 'Corte Feminino', profissional: 'Camila R.', data: '15/04/2025', valor: 'R$ 90', avaliacao: 5 },
        ];

        /* ---- Catálogo de serviços ---- */
        const catalogo = [
            { icon: 'ti-palette', nome: 'Coloração', desc: 'Coloração completa com produtos profissionais e proteção para os fios.', duracao: '2h30', valor: 'R$ 280' },
            { icon: 'ti-cut', nome: 'Corte Feminino', desc: 'Corte personalizado para valorizar seu estilo e formato de rosto.', duracao: '1h', valor: 'R$ 90' },
            { icon: 'ti-wind', nome: 'Escova & Tratamento', desc: 'Escova modeladora com tratamento hidratante profundo.', duracao: '1h30', valor: 'R$ 120' },
            { icon: 'ti-sparkles', nome: 'Manicure', desc: 'Cuidado completo para unhas das mãos com esmaltação e acabamento.', duracao: '50min', valor: 'R$ 60' },
            { icon: 'ti-droplet', nome: 'Hidratação Profunda', desc: 'Máscara nutritiva para recuperar o brilho e a saúde dos cabelos.', duracao: '1h', valor: 'R$ 95' },
            { icon: 'ti-eye', nome: 'Sobrancelha', desc: 'Design de sobrancelha com henna e brow lamination.', duracao: '45min', valor: 'R$ 45' },
        ];

        /* ---- Profissionais ---- */
        const profissionais = [
            { nome: 'Camila R.', role: 'Colorista & Cabeleireira', foto: 'https://randomuser.me/api/portraits/women/21.jpg', nota: 4.9 },
            { nome: 'Priya A.', role: 'Cabeleireira', foto: 'https://randomuser.me/api/portraits/women/33.jpg', nota: 4.8 },
            { nome: 'Lucas T.', role: 'Barbeiro', foto: 'https://randomuser.me/api/portraits/men/45.jpg', nota: 4.7 },
            { nome: 'Aline F.', role: 'Manicure & Pedicure', foto: 'https://randomuser.me/api/portraits/women/57.jpg', nota: 4.9 },
            { nome: 'Renata M.', role: 'Design & Estética', foto: 'https://randomuser.me/api/portraits/women/10.jpg', nota: 4.8 },
            { nome: 'Diego P.', role: 'Cabeleireiro', foto: 'https://randomuser.me/api/portraits/men/22.jpg', nota: 4.6 },
        ];

        /* ================================================================
           HELPERS
        ================================================================ */

        /** Atualiza classe active na sidebar */
        function setNavActive(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
        }

        /** Troca o conteúdo com fade */
        function navegarPara(renderFn) {
            const c = document.getElementById('page-content');
            c.style.transition = 'opacity 0.25s ease';
            c.style.opacity = '0';
            setTimeout(() => {
                c.innerHTML = '';
                renderFn(c);
                c.style.opacity = '1';
            }, 250);
        }

        /** Exibe toast */
        function toast(msg, icon = 'ti-check') {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.querySelector('i').className = `ti ${icon}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        /** Gera estrelas HTML */
        function estrelas(n) {
            let s = '';
            for (let i = 1; i <= 5; i++) {
                s += `<i class="ti ti-star${i <= n ? '-filled star-filled' : ''}"></i>`;
            }
            return s;
        }

        /* ================================================================
           TELAS
        ================================================================ */

        /* ---- INÍCIO ---- */
        function renderInicio(c) {
            const proximo = meusAgendamentos[0];

            c.innerHTML = `
        <!-- Saudação -->
        <div class="greeting-hero fade-in" style="margin-bottom:20px;">
            <p class="greeting-kicker">Bem-vinda de volta</p>
            <h2 class="greeting-title">Olá, <strong>${CLIENTE.nome.split(' ')[0]}!</strong></h2>
            <p class="greeting-sub">Seu próximo momento de cuidado está chegando — aproveite.</p>
        </div>

        <!-- Métricas rápidas -->
        <div class="metrics-grid" style="margin-bottom:20px;">

            <!-- Próximo agendamento -->
            <div class="metric-card fade-in" style="grid-column: span 2;">
                <p style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-dark);margin-bottom:10px;">
                    <i class="ti ti-calendar-event" style="margin-right:4px;"></i> Próximo agendamento
                </p>
                ${proximo ? `
                <p class="next-apt-service">${proximo.servico}</p>
                <div class="next-apt-row"><i class="ti ti-user"></i> ${proximo.profissional}</div>
                <div class="next-apt-row"><i class="ti ti-calendar"></i> ${proximo.data}</div>
                <div class="next-apt-row"><i class="ti ti-clock"></i> ${proximo.hora}</div>
                <div style="margin-top:10px;">
                    <span class="status-pill ${proximo.status}"><span class="status-dot"></span>${STATUS_LABEL[proximo.status]}</span>
                </div>
                ` : `<p style="color:var(--text-dim);font-size:12px;">Nenhum agendamento próximo.</p>`}
            </div>

            <!-- Total de agendamentos -->
            <div class="metric-card fade-in delay-1">
                <div class="metric-icon gold"><i class="ti ti-calendar-check"></i></div>
                <h1 class="metric-value">${CLIENTE.totalAgendamentos}</h1>
                <h2 class="metric-label">Agendamentos realizados</h2>
            </div>

            <!-- Avaliações -->
            <div class="metric-card fade-in delay-2">
                <div class="metric-icon rose"><i class="ti ti-star"></i></div>
                <h1 class="metric-value">${CLIENTE.avaliacoesFeitas}</h1>
                <h2 class="metric-label">Avaliações feitas</h2>
            </div>

        </div>

        <!-- Serviços favoritos -->
        <div class="panel fade-in delay-2" style="margin-bottom:20px;">
            <div class="panel-header">
                <h1 class="panel-title">Meus <em>favoritos</em></h1>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                ${CLIENTE.favoritos.map(f => `
                    <span class="fav-chip">
                        <i class="ti ti-heart-filled" style="font-size:10px;"></i> ${f}
                    </span>
                `).join('')}
            </div>
        </div>

        <!-- Atalhos -->
        <div class="panel fade-in delay-3">
            <div class="panel-header">
                <h1 class="panel-title">Ações <em>rápidas</em></h1>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;">
                <button class="btn btn-gold cursor-pointer" id="btnNovoApt">
                    <i class="ti ti-calendar-plus"></i> Novo Agendamento
                </button>
                <button class="btn btn-ghost cursor-pointer" id="btnVerServicos">
                    <i class="ti ti-cut"></i> Ver Serviços
                </button>
                <button class="btn btn-ghost cursor-pointer" id="btnVerHistorico">
                    <i class="ti ti-clock-history"></i> Meu Histórico
                </button>
            </div>
        </div>
        `;

            document.getElementById('btnNovoApt')?.addEventListener('click', () => {
                setNavActive('nav-agendamentos');
                navegarPara(renderAgendamentos);
            });
            document.getElementById('btnVerServicos')?.addEventListener('click', () => {
                setNavActive('nav-servicos');
                navegarPara(renderServicos);
            });
            document.getElementById('btnVerHistorico')?.addEventListener('click', () => {
                setNavActive('nav-historico');
                navegarPara(renderHistorico);
            });
        }

        /* ---- MEUS AGENDAMENTOS ---- */
        function renderAgendamentos(c) {
            c.innerHTML = `
        <div class="panel fade-in">
            <div class="panel-header">
                <h1 class="panel-title">Meus <em>Agendamentos</em></h1>
                <button class="btn btn-gold" id="btnNovoAptTabela">
                    <i class="ti ti-calendar-plus"></i> Novo Agendamento
                </button>
            </div>

            <div style="overflow-x:auto;">
                <table class="apt-table" style="width:100%;">
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Profissional</th>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-agendamentos"></tbody>
                </table>
            </div>

            ${meusAgendamentos.length === 0 ? `
                <p style="text-align:center;color:var(--text-dim);padding:28px 0;font-size:13px;">
                    Nenhum agendamento ativo.
                </p>` : ''}
        </div>
        `;

            const tbody = document.getElementById('tbody-agendamentos');
            meusAgendamentos.forEach(a => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td style="font-size:13px;font-weight:500;">${a.servico}</td>
                <td style="font-size:12px;color:var(--text-muted);">${a.profissional}</td>
                <td style="font-size:12px;color:var(--text-muted);">${a.data}</td>
                <td style="font-size:12px;color:var(--gold);font-weight:500;">${a.hora}</td>
                <td><span class="status-pill ${a.status}"><span class="status-dot"></span>${STATUS_LABEL[a.status]}</span></td>
                <td>
                    <div style="display:flex;gap:6px;">
                        <button class="btn btn-ghost" style="padding:5px 10px;font-size:11px;" data-id="${a.id}" data-action="reagendar">
                            <i class="ti ti-edit"></i> Reagendar
                        </button>
                        <button class="btn btn-danger" style="padding:5px 10px;font-size:11px;" data-id="${a.id}" data-action="cancelar">
                            <i class="ti ti-x"></i> Cancelar
                        </button>
                    </div>
                </td>
            `;
                tbody.appendChild(tr);
            });

            // Ações da tabela
            tbody.addEventListener('click', e => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const id = parseInt(btn.dataset.id);
                const action = btn.dataset.action;

                if (action === 'cancelar') {
                    if (confirm('Deseja cancelar este agendamento?')) {
                        const apt = meusAgendamentos.find(x => x.id === id);
                        if (apt) apt.status = 'cancelled';
                        toast('Agendamento cancelado.', 'ti-x');
                        navegarPara(renderAgendamentos);
                    }
                }
                if (action === 'reagendar') {
                    abrirModal();
                    toast('Selecione a nova data e horário.', 'ti-calendar');
                }
            });

            document.getElementById('btnNovoAptTabela')?.addEventListener('click', abrirModal);
        }

        /* ---- HISTÓRICO ---- */
        function renderHistorico(c) {
            c.innerHTML = `
        <div class="panel fade-in">
            <div class="panel-header">
                <h1 class="panel-title">Histórico de <em>Atendimentos</em></h1>
                <span class="panel-action">${historico.length} atendimentos</span>
            </div>
            <div id="historico-list"></div>
        </div>
        `;

            const list = document.getElementById('historico-list');
            historico.forEach(h => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                <div class="history-icon"><i class="ti ti-cut"></i></div>
                <div class="history-info">
                    <p class="history-service">${h.servico}</p>
                    <p class="history-meta">com ${h.profissional} · ${h.data}</p>
                </div>
                <div class="history-right">
                    <p class="history-value">${h.valor}</p>
                    <p class="history-stars">${estrelas(h.avaliacao)}</p>
                </div>
            `;
                list.appendChild(div);
            });
        }

        /* ---- SERVIÇOS ---- */
        function renderServicos(c) {
            c.innerHTML = `
        <div style="margin-bottom:16px;" class="fade-in">
            <h1 style="font-size:22px;font-weight:500;">Nossos <em>Serviços</em></h1>
            <p style="font-size:12px;color:var(--text-dim);margin-top:4px;">Escolha o serviço ideal para você e agende em poucos cliques.</p>
        </div>
        <div class="services-grid" id="services-grid"></div>
        `;

            const grid = document.getElementById('services-grid');
            catalogo.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `service-card fade-in`;
                div.style.animationDelay = `${i * 0.06}s`;
                div.innerHTML = `
                <div class="service-card-icon"><i class="ti ${s.icon}"></i></div>
                <p class="service-card-name">${s.nome}</p>
                <p class="service-card-desc">${s.desc}</p>
                <div class="service-card-meta">
                    <span class="service-meta-item"><i class="ti ti-clock"></i> ${s.duracao}</span>
                </div>
                <p class="service-price">${s.valor}</p>
                <button class="btn btn-gold" style="margin-top:8px;width:100%;justify-content:center;" data-servico="${s.nome}">
                    <i class="ti ti-calendar-plus"></i> Agendar
                </button>
            `;
                grid.appendChild(div);
            });

            grid.addEventListener('click', e => {
                const btn = e.target.closest('[data-servico]');
                if (btn) {
                    abrirModal(btn.dataset.servico);
                }
            });
        }

        /* ---- PROFISSIONAIS ---- */
        function renderProfissionais(c) {
            c.innerHTML = `
        <div style="margin-bottom:16px;" class="fade-in">
            <h1 style="font-size:22px;font-weight:500;">Nossa <em>Equipe</em></h1>
            <p style="font-size:12px;color:var(--text-dim);margin-top:4px;">Conheça os profissionais prontos para cuidar de você.</p>
        </div>
        <div class="prof-grid" id="prof-grid"></div>
        `;

            const grid = document.getElementById('prof-grid');
            profissionais.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'prof-card fade-in';
                div.style.animationDelay = `${i * 0.06}s`;
                div.innerHTML = `
                <img src="${p.foto}" class="prof-avatar" alt="${p.nome}" />
                <p class="prof-name">${p.nome}</p>
                <p class="prof-role">${p.role}</p>
                <div class="prof-stars">${estrelas(Math.round(p.nota))} <span style="color:var(--text-dim);margin-left:2px;">${p.nota}</span></div>
                <button class="btn btn-ghost" style="margin-top:10px;font-size:11px;" onclick="toast('Perfil de ${p.nome} em breve!','ti-user')">
                    <i class="ti ti-user"></i> Ver Perfil
                </button>
            `;
                grid.appendChild(div);
            });
        }

        /* ---- MEU PERFIL ---- */
        function renderPerfil(c) {
            c.innerHTML = `
        <div class="grid-2-1 fade-in">

            <!-- Formulário -->
            <div class="panel">
                <div class="panel-header">
                    <h1 class="panel-title">Meu <em>Perfil</em></h1>
                </div>

                <!-- Avatar -->
                <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
                    <div class="profile-avatar-wrap">
                        <img src="${CLIENTE.foto}" class="profile-avatar" id="perfil-foto" alt="${CLIENTE.nome}" />
                        <div class="profile-avatar-edit" onclick="toast('Upload de foto em breve!','ti-camera')">
                            <i class="ti ti-camera"></i>
                        </div>
                    </div>
                    <div>
                        <p style="font-size:15px;font-weight:600;color:var(--text);">${CLIENTE.nome}</p>
                        <p style="font-size:11px;color:var(--text-dim);">${CLIENTE.email}</p>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-input" id="input-nome" value="${CLIENTE.nome}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefone</label>
                        <input type="text" class="form-input" id="input-tel" value="${CLIENTE.telefone}" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-input" id="input-email" value="${CLIENTE.email}" />
                </div>

                <div style="border-top:1px solid var(--border);margin:20px 0;padding-top:20px;">
                    <p style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:14px;">
                        <i class="ti ti-lock" style="color:var(--gold-dark);margin-right:4px;"></i>
                        Alterar Senha
                    </p>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Senha atual</label>
                            <input type="password" class="form-input" placeholder="••••••••" />
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nova senha</label>
                            <input type="password" class="form-input" placeholder="••••••••" />
                        </div>
                    </div>
                </div>

                <button class="btn btn-gold" id="btn-salvar" style="width:100%;justify-content:center;">
                    <i class="ti ti-device-floppy"></i> Salvar Alterações
                </button>
            </div>

            <!-- Resumo -->
            <div class="gap-y">
                <div class="panel fade-in delay-1">
                    <div class="panel-header" style="margin-bottom:12px;">
                        <h1 class="panel-title">Resumo <em>da conta</em></h1>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:12px;color:var(--text-dim);">Agendamentos realizados</span>
                            <span style="font-size:14px;font-weight:600;color:var(--gold);">${CLIENTE.totalAgendamentos}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:12px;color:var(--text-dim);">Avaliações feitas</span>
                            <span style="font-size:14px;font-weight:600;color:var(--gold);">${CLIENTE.avaliacoesFeitas}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:12px;color:var(--text-dim);">Próximos agendamentos</span>
                            <span style="font-size:14px;font-weight:600;color:var(--gold);">${meusAgendamentos.filter(a => a.status !== 'cancelled').length}</span>
                        </div>
                    </div>
                </div>

                <div class="panel fade-in delay-2">
                    <div class="panel-header" style="margin-bottom:12px;">
                        <h1 class="panel-title">Serviços <em>favoritos</em></h1>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;">
                        ${CLIENTE.favoritos.map(f => `<span class="fav-chip"><i class="ti ti-heart-filled" style="font-size:10px;"></i> ${f}</span>`).join('')}
                    </div>
                </div>
            </div>

        </div>
        `;

            document.getElementById('btn-salvar')?.addEventListener('click', () => {
                CLIENTE.nome = document.getElementById('input-nome').value;
                CLIENTE.email = document.getElementById('input-email').value;
                CLIENTE.telefone = document.getElementById('input-tel').value;
                toast('Perfil atualizado com sucesso!', 'ti-check');
            });
        }

        /* ================================================================
           MODAL DE AGENDAMENTO
        ================================================================ */
        function abrirModal(servicoPresel) {
            const modal = document.getElementById('modalAgendar');
            modal.classList.add('open');
            if (servicoPresel) {
                const sel = document.getElementById('modalServico');
                if (sel) {
                    for (let opt of sel.options) {
                        if (opt.value === servicoPresel) { sel.value = servicoPresel; break; }
                    }
                }
            }
        }
        function fecharModal() {
            document.getElementById('modalAgendar').classList.remove('open');
        }

        document.getElementById('modalCancelar').addEventListener('click', fecharModal);
        document.getElementById('modalAgendar').addEventListener('click', e => {
            if (e.target === document.getElementById('modalAgendar')) fecharModal();
        });
        document.getElementById('modalConfirmar').addEventListener('click', () => {
            const servico = document.getElementById('modalServico').value;
            const prof = document.getElementById('modalProf').value;
            const data = document.getElementById('modalData').value;
            const hora = document.getElementById('modalHora').value;

            if (!data) { toast('Selecione uma data!', 'ti-alert-circle'); return; }

            // Formata data pt-BR
            const [y, m, d] = data.split('-');
            const dataFmt = `${d}/${m}/${y}`;

            meusAgendamentos.push({
                id: Date.now(), servico, profissional: prof,
                data: dataFmt, hora, status: 'pending'
            });

            fecharModal();
            toast(`Agendamento de ${servico} confirmado!`);
        });

        /* ================================================================
           NAVEGAÇÃO — eventos de clique
        ================================================================ */
        const rotas = {
            'nav-inicio': { fn: renderInicio, titulo: 'Olá, <em>Ana!</em>' },
            'nav-agendamentos': { fn: renderAgendamentos, titulo: 'Meus <em>Agendamentos</em>' },
            'nav-historico': { fn: renderHistorico, titulo: 'Histórico de <em>Atendimentos</em>' },
            'nav-servicos': { fn: renderServicos, titulo: 'Nossos <em>Serviços</em>' },
            'nav-profissionais': { fn: renderProfissionais, titulo: 'Nossa <em>Equipe</em>' },
            'nav-perfil': { fn: renderPerfil, titulo: 'Meu <em>Perfil</em>' },
        };

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();
                const id = item.id;
                const rota = rotas[id];
                if (!rota) return;

                setNavActive(id);
                document.getElementById('topbar-title').innerHTML = rota.titulo;
                navegarPara(rota.fn);
            });
        });


        /* ================================================================
           DATA NO TOPBAR
        ================================================================ */
        const hoje = new Date();
        document.getElementById('topbar-date').textContent = hoje.toLocaleDateString('pt-BR', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        /* ================================================================
           CARREGAMENTO INICIAL
        ================================================================ */
        navegarPara(renderInicio);

    </script>

</body>

</html>
