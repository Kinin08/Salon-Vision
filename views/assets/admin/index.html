<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salon Vision | Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@300;400;500;600;700&family=Yuji+Syuku&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./script/main.js"></script>
    <style>

    </style>
</head>

<body>

    <div class="aurora-wrap">
        <div class="aurora-1"></div>
        <div class="aurora-2"></div>
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg class="w-8 h-8 text-[#FFCC7F]" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <path d="M12 2L3 7l9 5 9-5-9-5zM3 17l9 5 9-5M3 12l9 5 9-5" />
                </svg>
                <div>
                    <div class="font-yuji text-xl text-white [text-shadow:0_0_10px_rgba(255,204,127,0.8)]">
                        <span class="text-[#CA9440]">S</span><span>alon</span>
                        <span class="text-[#CA9440]">V</span><span>ision</span>
                    </div>
                    <span class="logo-badge-admin">ADMIN</span>
                </div>
            </div>

            <nav>
                <div class="nav-section-label">Menu</div>
                <a id="nav-dashboard" class="nav-item active">
                    <i class="ti ti-home"></i> Inicio
                </a>
                <a id="nav-agendamentos" class="nav-item">
                    <i class="ti ti-calendar"></i> Agendamentos
                </a>
                <a id="nav-avaliacoes" class="nav-item">
                    <i class="ti ti-star"></i> Avaliações
                </a>
                <a id="nav-faqs" class="nav-item">
                    <i class="ti ti-home-question"></i> Perguntas Frequentes
                </a>
                <div class="nav-section-label">Gestão</div>
                <a id="nav-clientes" class="nav-item">
                    <i class="ti ti-users"></i> Clientes
                </a>
                <a id="nav-profissionais" class="nav-item">
                    <i class="ti ti-user-star"></i> Profissionais
                </a>
                <a id="nav-servicos" class="nav-item">
                    <i class="ti ti-cut"></i> Serviços
                </a>
                <h2 class="nav-label" style="margin-top:10px;">Conta</h2>

                <a id="nav-perfil" class="nav-item cursor-pointer" href="#">
                    <i class="ti ti-user-circle"></i>
                    <h1>Meu Perfil</h1>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <div class="admin-card">
                    <img src="https://i.pravatar.cc/80?img=12" class="admin-avatar" />
                    <div class="admin-info">
                        <p>Marcos Silva</p>
                        <span>Administrador</span>
                    </div>
                    <i class="ti ti-dots-vertical" style="margin-left:auto;color:var(--text-dim);font-size:13px;"></i>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="main">
            <header class="topbar">
                <div>
                    <h1 class="topbar-title" id="topbar-title">Dashboard <em>Geral</em></h1>
                    <p class="topbar-date" id="topbar-date"></p>
                </div>
                <div class="topbar-right">
                    <div class="topbar-icon-btn" onclick="toast('Sem novas notificações.')">
                        <i class="ti ti-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                    <div class="topbar-icon-btn" onclick="toast('Busca global em breve!')">
                        <i class="ti ti-search"></i>
                    </div>
                    <img src="https://i.pravatar.cc/80?img=12"
                        style="width:34px;height:34px;border-radius:9px;object-fit:cover;border:1px solid var(--border-strong);" />
                </div>
            </header>

            <main class="content" id="page-content"></main>
        </div>
    </div>

    <!-- MODAL: NOVO AGENDAMENTO -->
    <div class="modal-overlay" id="modalAgendar">
        <div class="modal-box">
            <h2 class="modal-title">Novo <em>Agendamento</em></h2>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Cliente</label>
                    <input type="text" class="form-input" id="m-cliente" placeholder="Nome do cliente" />
                </div>
                <div class="form-group">
                    <label class="form-label">Serviço</label>
                    <select class="form-input" id="m-servico">
                        <option>Coloração</option>
                        <option>Corte Feminino</option>
                        <option>Escova & Tratamento</option>
                        <option>Manicure</option>
                        <option>Hidratação Profunda</option>
                        <option>Sobrancelha</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Profissional</label>
                <select class="form-input" id="m-prof">
                    <option>Camila R.</option>
                    <option>Priya A.</option>
                    <option>Lucas T.</option>
                    <option>Aline F.</option>
                    <option>Renata M.</option>
                </select>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Data</label>
                    <input type="date" class="form-input" id="m-data" />
                </div>
                <div class="form-group">
                    <label class="form-label">Horário</label>
                    <select class="form-input" id="m-hora">
                        <option>09:00</option>
                        <option>09:30</option>
                        <option>10:00</option>
                        <option>10:30</option>
                        <option>11:00</option>
                        <option>14:00</option>
                        <option>14:30</option>
                        <option>15:00</option>
                        <option>15:30</option>
                        <option>16:00</option>
                    </select>
                </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn btn-gold" style="flex:1" id="m-confirmar"><i class="ti ti-check"></i>
                    Confirmar</button>
                <button class="btn btn-ghost" id="m-cancelar"><i class="ti ti-x"></i> Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NOVO SERVIÇO -->
    <div class="modal-overlay" id="modalServico">
        <div class="modal-box">
            <h2 class="modal-title">Novo <em>Serviço</em></h2>
            <div class="form-group">
                <label class="form-label">Nome do serviço</label>
                <input type="text" class="form-input" id="ms-nome" placeholder="Ex: Progressiva" />
            </div>
            <div class="form-group">
                <label class="form-label">Descrição</label>
                <textarea class="form-input" id="ms-desc" rows="3" placeholder="Descreva o serviço..."></textarea>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Duração</label>
                    <input type="text" class="form-input" id="ms-dur" placeholder="Ex: 1h30" />
                </div>
                <div class="form-group">
                    <label class="form-label">Valor</label>
                    <input type="text" class="form-input" id="ms-valor" placeholder="Ex: R$ 150" />
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-gold" style="flex:1" id="ms-confirmar"><i class="ti ti-check"></i>
                    Salvar</button>
                <button class="btn btn-ghost" id="ms-cancelar"><i class="ti ti-x"></i> Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NOVO PROFISSIONAL -->
    <div class="modal-overlay" id="modalProf">
        <div class="modal-box">
            <h2 class="modal-title">Novo <em>Profissional</em></h2>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-input" id="mp-nome" placeholder="Nome completo" />
                </div>
                <div class="form-group">
                    <label class="form-label">Especialidade</label>
                    <input type="text" class="form-input" id="mp-role" placeholder="Ex: Colorista" />
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-input" id="mp-tel" placeholder="(51) 99000-0000" />
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-gold" style="flex:1" id="mp-confirmar"><i class="ti ti-check"></i>
                    Cadastrar</button>
                <button class="btn btn-ghost" id="mp-cancelar"><i class="ti ti-x"></i> Cancelar</button>
            </div>
        </div>
    </div>

    <div id="toast"><i class="ti ti-check"></i> <span id="toast-msg">Ação realizada!</span></div>
</body>

</html>
