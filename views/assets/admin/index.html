    <!-- MODAL: NOVO AGENDAMENTO -->

                        <option>Manicure</option>
                        <option>Hidratação Profunda</option>

                </div>
            </div>

                    <option>Lucas T.</option>
                    <option>Aline F.</option>
                    <option>Renata M.</option>

                    <label class="form-label">Data</label>

                <textarea class="form-input" id="ms-desc" rows="3" placeholder="Descreva o serviço..."></textarea>
            </div>

                <div class="form-group">
                    <label class="form-label">Duração</label>
                    <input type="text" class="form-input" id="ms-dur" placeholder="Ex: 1h30" />
                </div>
                <div class="form-group">
                    <label class="form-label">Valor</label>
                    <input type="text" class="form-input" id="ms-valor" placeholder="Ex: R$ 150" />
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-gold" style="flex:1" id="ms-confirmar"><i class="ti ti-check"></i>

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const c = document.getElementById('page-content');
            c.style.transition = 'opacity .22s';
            c.style.opacity = '0';
            setTimeout(() => {
                c.innerHTML = '';
                renderFn(c);
                c.style.opacity = '1';
                document.getElementById('topbar-title').innerHTML = title;
            }, 220);

            const t = document.getElementById('toast');

            t.querySelector('i').className = `ti ${icon}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

            for (let i = 1; i <= 5; i++) s += `<i class="ti ti-star${i <= n ? '-filled star-filled' : ''}"></i>`;

            function renderRows(filter) {
                const tbody = document.getElementById('tbody-apt');

                    tr.innerHTML = `
            <td style="font-weight:500;font-size:12.5px;">${a.cliente}</td>

                <div style="display:flex;gap:5px;">
                    ${a.status === 'pending' ? `<button class="btn btn-green btn-sm" data-id="${a.id}" data-action="confirmar"><i class="ti ti-check"></i> Confirmar</button>` : ''}

                        apt.status = 'confirmed';
                        toast('Agendamento confirmado!', 'ti-check');
                        updateBadge();
                        renderRows(filter);

                    if (btn.dataset.action === 'cancelar') {

                            renderRows(filter);

                        ${CLIENTE.favoritos.map(f => `<span class="fav-chip"><i class="ti ti-heart-filled" style="font-size:10px;"></i> ${f}</span>`).join('')}
                    </div>
                </div>
            </div>

        </div>
        `;

            document.getElementById('btn-salvar')?.addEventListener('click', () => {
                CLIENTE.nome = document.getElementById('input-nome').value;
                CLIENTE.email = document.getElementById('input-email').value;
                CLIENTE.telefone = document.getElementById('input-tel').value;
                toast('Perfil atualizado com sucesso!', 'ti-check');
            });
        }

        /* ---- BADGE UPDATE ---- */
        function updateBadge() {
            const p = agendamentos.filter(a => a.status === 'pending').length;

            const badge = document.getElementById('badge-apt');
            if (badge) {
                badge.textContent = p;
            }
        }

        /* ---- MODAIS ---- */
        document.getElementById('m-cancelar').addEventListener('click', () => closeModal('modalAgendar'));
        document.getElementById('modalAgendar').addEventListener('click', e => { if (e.target === document.getElementById('modalAgendar')) closeModal('modalAgendar'); });
        document.getElementById('m-confirmar').addEventListener('click', () => {
            const cliente = document.getElementById('m-cliente').value.trim();
            const data = document.getElementById('m-data').value;
            if (!cliente) { toast('Informe o nome do cliente!', 'ti-alert-circle'); return; }
            if (!data) { toast('Selecione uma data!', 'ti-alert-circle'); return; }
            const [y, m, d] = data.split('-');
            agendamentos.push({
                id: Date.now(),
                cliente,
                servico: document.getElementById('m-servico').value,
                prof: document.getElementById('m-prof').value,
                data: `${d}/${m}/${y}`,
                hora: document.getElementById('m-hora').value,
                status: 'pending'
            });
            updateBadge();
            closeModal('modalAgendar');
            toast('Agendamento criado!');
            nav(renderAgendamentos, 'Gestão de <em>Agendamentos</em>');
            setActive('nav-agendamentos');
        });

        document.getElementById('ms-cancelar').addEventListener('click', () => closeModal('modalServico'));
        document.getElementById('modalServico').addEventListener('click', e => { if (e.target === document.getElementById('modalServico')) closeModal('modalServico'); });
        document.getElementById('ms-confirmar').addEventListener('click', () => {
            const nome = document.getElementById('ms-nome').value.trim();
            if (!nome) { toast('Informe o nome do serviço!', 'ti-alert-circle'); return; }
            catalogo.push({ id: Date.now(), icon: 'ti-sparkles', nome, desc: document.getElementById('ms-desc').value, duracao: document.getElementById('ms-dur').value || '—', valor: document.getElementById('ms-valor').value || 'R$ —' });
            closeModal('modalServico');
            toast('Serviço criado!');
            nav(renderServicos, 'Catálogo de <em>Serviços</em>');
            setActive('nav-servicos');
        });

        document.getElementById('mp-cancelar').addEventListener('click', () => closeModal('modalProf'));
        document.getElementById('modalProf').addEventListener('click', e => { if (e.target === document.getElementById('modalProf')) closeModal('modalProf'); });
        document.getElementById('mp-confirmar').addEventListener('click', () => {
            const nome = document.getElementById('mp-nome').value.trim();
            if (!nome) { toast('Informe o nome!', 'ti-alert-circle'); return; }
            profissionais.push({ id: Date.now(), nome, role: document.getElementById('mp-role').value || 'Especialista', foto: `https://i.pravatar.cc/80?img=${Math.floor(Math.random() * 70)}`, nota: 5.0, ativo: true });
            closeModal('modalProf');
            toast('Profissional cadastrado!');
            nav(renderProfissionais, 'Nossa <em>Equipe</em>');
            setActive('nav-profissionais');
        });

        /* ---- NAVEGAÇÃO ---- */
        const rotas = {
            'nav-dashboard': { fn: renderDashboard, titulo: 'Dashboard <em>Geral</em>' },
            'nav-agendamentos': { fn: renderAgendamentos, titulo: 'Gestão de <em>Agendamentos</em>' },
            'nav-clientes': { fn: renderClientes, titulo: 'Gestão de <em>Clientes</em>' },
            'nav-profissionais': { fn: renderProfissionais, titulo: 'Nossa <em>Equipe</em>' },
            'nav-faqs': { fn: renderFaqs, titulo: 'Perguntas mais <em>Frequentes</em>' },
            'nav-servicos': { fn: renderServicos, titulo: 'Catálogo de <em>Serviços</em>' },
            'nav-avaliacoes': { fn: renderAvaliacoes, titulo: 'Central de <em>Avaliações</em>' },
            'nav-perfil': { fn: renderPerfil, titulo: '<em>Perfil</em>' },
        };
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', e => {
                e.preventDefault();
                const rota = rotas[item.id];
                if (!rota) return;
                setActive(item.id);
                nav(rota.fn, rota.titulo);
            });
        });

        /* ---- TOPBAR DATE ---- */
        document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('pt-BR', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        /* ---- INIT ---- */
        nav(renderDashboard, 'Dashboard <em>Geral</em>');
    </script>
</body>

</html>
